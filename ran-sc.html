<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TV Online</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<h1>TV Online</h1>

<video id="video" controls width="800"></video>

<script>
const video = document.getElementById('video');
const videoSrc = 'https://unlimited1-cl-isp.dps.live/ucvtv2/ucvtv2.smil/playlist.m3u8';

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(videoSrc);
  hls.attachMedia(video);
} else {
  video.src = videoSrc;
}
</script>
<div id="fb-root"></div>
<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v23.0">
</script>

<div class="fb-like"
     data-href="https://www.facebook.com/FutboLike"
     data-width=""
     data-layout="button"
     data-action="like"
     data-size="large"
     data-share="true">
</div>

  
</body>
</html>
