<head>
<meta charset="UTF-8">
<title>Síguenos en Facebook</title>

<style>
.facebook-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #1877F2, #0d5bd7);
    color: white;
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    box-shadow: 0 6px 15px rgba(24, 119, 242, 0.4);
    transition: all 0.3s ease;
}

.facebook-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(24, 119, 242, 0.6);
}

.facebook-icon {
    font-size: 24px;
}
</style>
</head>
<body>

<a href="https://www.facebook.com/FutboLike"
   target="_blank"
   class="facebook-btn">
    <span class="facebook-icon">📘</span>
    Síguenos en Facebook
</a>

</body>
